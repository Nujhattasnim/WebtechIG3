<!DOCTYPE html>
<html>
 <head>
    <title>Jailer Registration - Prison Cell Management System</title>
 </head>
   <body>
    <h1>Prison Cell Management System</h1>
    <h2>Jailer / Warden Registration</h2>

     <hr>

    <form action="submitJailer.html" method="post">

<fieldset>
    <legend>Personal Information</legend>

    <table cellpadding="6">
        <tr>
            <td><label for="fullname">Full Name:</label></td>
            <td><input type="text" id="fullname" name="fullname" placeholder="Enter full name" required></td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td><input type="email" id="email" name="email" placeholder="example@prison.gov" required></td>
        </tr>
        <tr>
            <td><label for="phone">Phone Number:</label></td>
            <td><input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" required></td>
        </tr>
        <tr>
            <td><label for="dob">Date of Birth:</label></td>
            <td><input type="date" id="dob" name="dob"></td>
        </tr>
        <tr>
            <td><label>Gender:</label></td>
            <td>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </td>
        </tr>
        <tr>
            <td><label for="address">Address:</label></td>
            <td><textarea id="address" name="address" rows="3" cols="30" placeholder="Enter address"></textarea></td>
        </tr>
        <tr>
            <td><label for="photo">Profile Photo:</label></td>
            <td><input type="file" id="photo" name="photo" accept="image/*"></td>
        </tr>
    </table>

</fieldset>
<fieldset>
    <legend>Jailer Official Information (Unique Inputs)</legend>

    <table cellpadding="6">
        <tr>
            <td><label for="badge">Badge Number:</label></td>
            <td><input type="text" id="badge" name="badge" placeholder="e.g., JLR-2024-001" required></td>
        </tr>
        <tr>
            <td><label for="shift">Shift Schedule:</label></td>
            <td>
                <select id="shift" name="shift" required>
                    <option value="">-- Select Shift --</option>
                    <option value="morning">Morning (6AM - 2PM)</option>
                    <option value="evening">Evening (2PM - 10PM)</option>
                    <option value="night">Night (10PM - 6AM)</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="block">Assigned Block / Wing:</label></td>
            <td>
                <select id="block" name="block" required>
                    <option value="">-- Select Block --</option>
                    <option value="block_a">Block A - High Security</option>
                    <option value="block_b">Block B - Medium Security</option>
                    <option value="block_c">Block C - Low Security</option>
                    <option value="block_d">Block D - Medical Wing</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="passcode">Security Passcode:</label></td>
            <td><input type="password" id="passcode" name="passcode" placeholder="Enter secure passcode" required></td>
        </tr>
        <tr>
            <td><label for="experience">Years of Service:</label></td>
            <td><input type="number" id="experience" name="experience" min="0" max="50" placeholder="e.g., 5"></td>
        </tr>
    </table>

</fieldset>

        <br>

       <fieldset>
    <legend>Account Credentials</legend>

    <table>
        <tr>
            <td><label for="username">Username:</label></td>
            <td><input type="text" id="username" name="username" placeholder="Choose a username" required></td>
        </tr>
        <tr>
            <td><label for="password">Password:</label></td>
            <td><input type="password" id="password" name="password" placeholder="Enter password" required></td>
        </tr>
        <tr>
            <td><label for="confirm">Confirm Password:</label></td>
            <td><input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required></td>
        </tr>
    </table>

</fieldset>

        <br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions of the Prison Department.</label><br><br>
    <center>
        <input type="submit" value="Register as Jailer">
        <input type="reset" value="Clear Form">
        </center>

    </form>

    <hr>

    <p>Already have an account? <a href="../commonui/login.html">Login here</a></p>
    <p><a href="../commonui/index.html">Back to Home</a></p>

    </body>
</html>
