<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Registration - Prison Cell Management System</title>
    <!-- External CSS link -->
    <link rel="stylesheet" href="../css/visitor.css">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <h1>Prison Cell Management System</h1>
        <h2>Visitor Registration Portal</h2>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../commonui/login.html">Already have an account? Login here</a></li>
            <li><a href="../commonui/index.html">Back to Home</a></li>
        </ul>
    </nav>

    <!-- Main Form Container -->
    <main class="container">
        <div class="form-container">
            <form action="#" method="POST" enctype="multipart/form-data">
                <h2>Create Visitor Account</h2>
                
                <!-- Standard User Fields -->
                <div class="input-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Unique Visitor Registration Inputs -->
                <div class="input-group">
                    <label for="relation">Relation to Inmate:</label>
                    <input type="text" id="relation" name="relation" placeholder="e.g., Spouse, Lawyer, Parent" required>
                </div>

                <div class="input-group">
                    <label for="inmate_id">Target Inmate ID:</label>
                    <input type="text" id="inmate_id" name="inmate_id" placeholder="e.g., INM-1024" required>
                </div>

                <div class="input-group">
                    <label for="id_document">National ID Document:</label>
                    <input type="file" id="id_document" name="id_document" required>
                </div>

                <div class="input-group">
                    <label for="id_proof_number">ID Proof Number:</label>
                    <input type="text" id="id_proof_number" name="id_proof_number" placeholder="Enter ID Card Number" required>
                </div>

                <div class="input-group">
                    <label for="contact_address">Contact Address:</label>
                    <textarea id="contact_address" name="contact_address" rows="4" placeholder="Enter your full residential address" required></textarea>
                </div>

                <!-- Submit and Reset Buttons -->
                <div class="button-group">
                    <input type="submit" value="Register" class="btn btn-primary">
                    <input type="reset" value="Clear Form" class="btn btn-secondary">
                </div>
            </form>
        </div>
    </main>

</body>
</html>
