<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
</head>
<body>

<center>
    <h1>Prison Cell Management System</h1>
    <p><b>Safety | Security | Better Tomorrow</b></p>
    <hr>
    <h2>Patient Registration Form</h2>
    <p>Register a Prisoner for Medical Care</p>
</center>

<form action="#" method="post">

    <fieldset>
        <legend><h3>Personal Information</h3></legend>

        <label for="name">Prisoner Full Name:</label><br>
        <input type="text" id="name" name="name"
        placeholder="Enter full name" required>
        <br><br>

        <label for="patientid">Prisoner ID:</label><br>
        <input type="text" id="patientid" name="patientid"
        placeholder="Enter patient ID" required>
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="gender">Gender:</label><br>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <label for="blood">Blood Group:</label><br>
        <select id="blood" name="blood">
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
        <br><br>

        <label for="photo">Prisoner Photo:</label><br>
        <input type="file" id="photo" name="photo" accept="image/*">
    </fieldset>

    <br>

    <fieldset>
        <legend><h3>Prison Information</h3></legend>

        <label for="cell">Cell Number:</label><br>
        <input type="text" id="cell" name="cell"
        placeholder="Enter cell number" required>
        <br><br>

        <label for="block">Assigned Block:</label><br>
        <select id="block" name="block" required>
            <option value="">Select Block</option>
            <option value="A">Block A</option>
            <option value="B">Block B</option>
            <option value="C">Block C</option>
            <option value="D">Block D</option>
        </select>
        <br><br>

        <label for="admission">Admission Date:</label><br>
        <input type="date" id="admission" name="admission" required>
        <br><br>

        <label for="case">Case Reference:</label><br>
        <input type="text" id="case" name="case"
        placeholder="Enter case reference">
    </fieldset>

    <br>

    <fieldset>
        <legend><h3>Medical Information</h3></legend>

        <label for="condition">Current Medical Condition:</label><br>
        <textarea id="condition" name="condition" rows="4" cols="35"
        placeholder="Describe medical condition"></textarea>
        <br><br>

        <label for="allergy">Known Allergies:</label><br>
        <input type="text" id="allergy" name="allergy"
        placeholder="Enter known allergies">
        <br><br>

        <label for="doctor">Assigned Doctor:</label><br>
        <input type="text" id="doctor" name="doctor"
        placeholder="Enter doctor's name">
        <br><br>

        <label for="emergency">Emergency Contact Number:</label><br>
        <input type="tel" id="emergency" name="emergency"
        placeholder="Enter contact number">
    </fieldset>

    <br>

    <fieldset>
        <legend><h3>Confirmation</h3></legend>

        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">
            I confirm that the patient information is correct.
        </label>
    </fieldset>

    <br>

    <center>
        <input type="submit" value="Register Patient">
        <input type="reset" value="Clear Form">
    </center>

</form>

<hr>

<center>
    <p>
        <a href="../commonui/index.html">Back to Home</a>
        |
        <a href="../commonui/login.html">Login</a>
    </p>
    <p>Prison Cell Management System</p>
</center>

</body>
</html>
